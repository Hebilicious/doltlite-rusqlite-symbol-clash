[package]
name = "doltlite-rusqlite-symbol-clash"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# On by default: `cargo run` links rusqlite next to doltlite and shows the bug.
# `cargo run --no-default-features` leaves rusqlite out and works.
default = ["rusqlite"]

[dependencies]
doltlite = "=0.51.13"
rusqlite = { version = "=0.37.0", features = ["bundled"], optional = true }
